packages:
  - 'packages/*'
  - '!packages/coinpay-php'

# Security overrides for transitive dependencies.
#
# These previously lived in package.json under `pnpm.overrides`. pnpm 11 stopped
# reading that field, which silently un-pinned every entry below and let the
# known-vulnerable versions back into the tree — the cause of the open Dependabot
# alerts. `pnpm-workspace.yaml` is where pnpm 10+ expects them.
#
# If you ever see "The 'pnpm' field in package.json is no longer read by pnpm",
# overrides have gone missing again. Do not ignore that warning.
overrides:
  axios: '>=1.14.0'
  lodash-es: '>=4.18.0'
  # Pinned to 2.1.4 exactly, NOT '>=5.0.6' as before. v5 dropped the CommonJS
  # default export, so minimatch@9 calls `brace_expansion_1.default(...)` and
  # dies with "is not a function", taking eslint down with it. A range like
  # '>=2.1.4' does not help — pnpm resolves it to the highest match, which is v5
  # again. 2.1.4 carries the DoS fix and keeps the export shape consumers expect.
  brace-expansion: '2.1.4'
  picomatch: '>=4.0.4'
  flatted: '>=3.4.2'
  h3: '>=1.15.11'
  socket.io-parser: '>=4.2.6'
  minimatch: '>=9.0.9'
  rollup: '>=4.60.1'
  bn.js: '>=5.2.3'
  ajv: '6.14.0'
  lodash: '>=4.18.0'
  jws: '>=4.0.1'
  esbuild: '>=0.25.0'
  protobufjs: '>=8.2.0'
  postcss: '>=8.5.10'
  follow-redirects: '>=1.16.0'
  uuid: '>=14.0.0'
  ip-address: '>=10.1.1'
  'ws@>=8.0.0': '>=8.20.1'
  # Added while re-homing the block — these had open alerts but no prior pin.
  # Kept within the current major of each package so nothing has to change at
  # the call sites; the alerts are all fixed in patch releases.
  dompurify: '>=3.4.12'
  # All versions, not just 4.x. The remaining 3.15.0 copy came in via
  # @istanbuljs/load-nyc-config -> babel-plugin-istanbul, i.e. coverage tooling
  # that never runs in production. Forcing it to 4.x crosses a major, so the
  # test suite and build were run to confirm nothing depends on the 3.x API.
  js-yaml: '>=4.3.1'
  'ws@>=7.0.0 <8.0.0': '>=7.5.10'
  'ws@<7.0.0': '>=6.2.3'
  tar: '>=7.5.22'
  form-data: '>=4.0.6'
  ua-parser-js: '>=2.0.10'
  valibot: '>=1.4.2'
  # Fixes the inherited libvips CVEs (CVE-2026-33327/33328/35590/35591).
  #
  # Next pins `sharp: ^0.34.5` as an optional dependency, and a caret on a 0.x
  # version locks the minor — so ^0.34.5 can never reach 0.35.x on its own. This
  # override is the only way off the vulnerable line without waiting for Next.
  # sharp is pre-1.0, so 0.34 -> 0.35 is a breaking change and it ships prebuilt
  # native binaries; image rendering was verified after the bump, not assumed.
  sharp: '>=0.35.3'
  # Build-time only, but pinned so the alert list stays at zero and a real one
  # is not lost in the noise.
  '@opentelemetry/core': '>=2.10.0'
  '@babel/core': '>=7.29.2'
  # Deliberately NOT pinned:
  #   elliptic — 6.6.1 is already the latest published; no fix upstream yet.
  #
  #   image-size — GHSA-w3rx-r6r6-pgpr (ICNS parser infinite loop) and
  #   GHSA-5p2g-fcmc-qvqq (JXL/HEIF parser infinite loops). There is NO patched
  #   release: GitHub lists both as affecting `<= 2.0.2`, which is the newest
  #   version published, so an override cannot resolve them and pinning to 2.0.2
  #   would only look like a fix.
  #
  #   Reachability, checked rather than assumed: image-size arrives solely
  #   through metro (the React Native bundler), pulled in by react-native under
  #   the @solana/wallet-adapter-* packages. metro is build tooling for React
  #   Native and is never loaded by the Next.js server or shipped to the
  #   browser, and nothing in this repo imports any @solana/wallet-adapter
  #   package — they appear only in next.config.mjs `transpilePackages`. No code
  #   path here hands an ICNS, JXL or HEIF file to this parser.
  #
  #   Re-check when image-size publishes a fix, or drop the unused
  #   @solana/wallet-adapter-* dependencies, which removes the chain outright.

allowBuilds:
  blake-hash: set this to true or false
  bufferutil: set this to true or false
  core-js: set this to true or false
  esbuild: set this to true or false
  protobufjs: set this to true or false
  sharp: set this to true or false
  supabase: set this to true or false
  tiny-secp256k1: set this to true or false
  unrs-resolver: set this to true or false
  usb: set this to true or false
  utf-8-validate: set this to true or false
minimumReleaseAgeExclude:
  - '@profullstack/autoblog@0.4.0'
