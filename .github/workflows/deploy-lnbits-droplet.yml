name: Deploy LNbits Droplet

# Auto-deploys on push to master, by design.
#
# The audit flagged this as a missing approval gate (N-020): the job holds an
# SSH private key for a production droplet, so every merge reaches production
# infrastructure with nobody in the loop. That gate was added and then removed
# again at the maintainer's request — continuous deployment here is deliberate,
# and the trade-off is the maintainer's to make, not the audit's.
#
# If you ever want the gate back, it is two lines: replace the `on:` block with
# `workflow_dispatch:` and add `environment: production` to the job, then set a
# required reviewer under Settings -> Environments -> production.
#
# The credential handling below is NOT part of that trade-off and stays.
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy-lnbits:
    runs-on: ubuntu-latest
    env:
      # secrets ONLY — never vars.
      #
      # These previously fell back to `vars.*`. GitHub Actions variables are not
      # secrets: they are stored in plaintext, readable by anyone with repo
      # access, and — critically — NOT masked in job logs. An SSH private key or
      # a dotenv file of credentials supplied that way would be printed in the
      # clear by any step that echoed it. If the secret is missing the job now
      # fails loudly rather than silently reading a non-secret.
      ENV_FILE: ${{ secrets.ENV_FILE }}
      DIRECT_SSH_KEY: ${{ secrets.LNBITS_DROPLET_SSH_KEY || secrets.LNBITS_DROP_SSH_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Load ENV_FILE
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ENV_FILE:-}" ]; then
            echo "ENV_FILE is empty. Add secret/variable ENV_FILE with dotenv contents."
            exit 1
          fi

          # Export KEY=VALUE lines into job env (ignore comments/blank lines)
          while IFS= read -r line; do
            [[ -z "$line" || "$line" =~ ^[[:space:]]*# ]] && continue
            key="${line%%=*}"
            value="${line#*=}"
            key="${key#"${key%%[![:space:]]*}"}"
            key="${key%"${key##*[![:space:]]}"}"
            [[ -z "$key" ]] && continue
            {
              echo "$key<<__EOF__"
              echo "$value"
              echo "__EOF__"
            } >> "$GITHUB_ENV"
          done <<< "$ENV_FILE"

      - name: Validate required vars
        shell: bash
        run: |
          set -euo pipefail
          # Backward-compat aliases
          if [ -z "${LNBITS_DROPLET_SSH_KEY:-}" ] && [ -n "${LNBITS_DROP_SSH_KEY:-}" ]; then
            echo "LNBITS_DROPLET_SSH_KEY=${LNBITS_DROP_SSH_KEY}" >> "$GITHUB_ENV"
            export LNBITS_DROPLET_SSH_KEY="${LNBITS_DROP_SSH_KEY}"
          fi
          if [ -z "${LNBITS_DROPLET_SSH_KEY:-}" ] && [ -n "${DIRECT_SSH_KEY:-}" ]; then
            echo "LNBITS_DROPLET_SSH_KEY<<__EOF__" >> "$GITHUB_ENV"
            echo "${DIRECT_SSH_KEY}" >> "$GITHUB_ENV"
            echo "__EOF__" >> "$GITHUB_ENV"
            export LNBITS_DROPLET_SSH_KEY="${DIRECT_SSH_KEY}"
          fi

          for k in LNBITS_DROPLET_HOST LNBITS_DROPLET_USER LNBITS_DROPLET_SSH_KEY LNBITS_ADMIN_KEY; do
            if [ -z "${!k:-}" ]; then
              echo "Missing required ENV_FILE key: $k"
              exit 1
            fi
          done

      - name: Deploy to LNbits host
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.LNBITS_DROPLET_HOST }}
          username: ${{ env.LNBITS_DROPLET_USER }}
          key: ${{ env.LNBITS_DROPLET_SSH_KEY }}
          script_stop: true
          script: |
            cd ~/coinpayportal || exit 1
            git fetch origin master 2>&1 || true
            git reset --hard origin/master 2>&1
            sudo bash scripts/deploy-lnbits.sh 2>&1

      - name: Verify LNURLp endpoint
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -s -o /tmp/lnurlp.json -w "%{http_code}" "https://ln.coinpayportal.com/lnurlp/api/v1/links" \
            -H "X-Api-Key: ${LNBITS_ADMIN_KEY}")
          test "$code" = "200"
          head -c 500 /tmp/lnurlp.json
