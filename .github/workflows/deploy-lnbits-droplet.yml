name: Deploy LNbits (dev2)

# Auto-deploys on push to master, by design (see git history for the approval-gate
# discussion, N-020).
#
# LNbits + Core Lightning moved off the DigitalOcean droplet onto dev2 on 2026-10-06.
# The job ssh'es to dev2 as the deploy account with the same DEV2_* secrets as
# deploy-dev2.yml and runs ONE fixed, root-owned command:
#
#   sudo -n /usr/local/sbin/deploy-lnbits
#
# allowed by a single-command sudoers rule. It is a copy of scripts/deploy-lnbits.sh
# installed by hand, so a commit to this repo can no longer run arbitrary code as
# root on the LNbits host. After changing scripts/deploy-lnbits.sh, re-install it:
#
#   sudo install -m 755 -o root -g root scripts/deploy-lnbits.sh /usr/local/sbin/deploy-lnbits
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-lnbits
  cancel-in-progress: false

permissions: {}

jobs:
  deploy-lnbits:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Set up ssh
        env:
          SSH_KEY: ${{ secrets.DEV2_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEV2_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy LNbits
        env:
          DEV2_USER: ${{ secrets.DEV2_USER }}
          DEV2_HOST: ${{ secrets.DEV2_HOST }}
        run: ssh -o BatchMode=yes "$DEV2_USER@$DEV2_HOST" sudo -n /usr/local/sbin/deploy-lnbits

      - name: Verify LNbits answers
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://ln.coinpayportal.com/api/v1/health" || true)
            [ "$code" = "200" ] && { echo "ln.coinpayportal.com $code"; exit 0; }
            echo "attempt $i: $code"; sleep 10
          done
          echo "ln.coinpayportal.com never answered"; exit 1
